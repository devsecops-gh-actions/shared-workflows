# ci-node.yml
# Workflow reutilizable: build y tests de proyectos Node.js / TypeScript (npm, pnpm, yarn).
# Contrato: docs en pipelines/build/README.md. Check requerido: <caller>/build-and-test.
name: CI Node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Subcarpeta del proyecto (monorepos). Relativa a la raiz del repo.
        type: string
        default: '.'
      matrix:
        description: 'JSON con combinaciones de runtime. Clave `node`. Ej.: {"node":["22","24"]}. Se fusiona con el valor por defecto.'
        type: string
        default: '{}'
      kind:
        description: '`application` (produce dist/ empaquetado) o `library` (produce .tgz de npm pack).'
        type: string
        required: true
      run-tests:
        description: Ejecutar `npm test` (script `test` obligatorio) en la matriz.
        type: boolean
        default: true
      publish:
        description: Solo `library`. Valida tag vX.Y.Z y coincidencia con package.json. No publica; la publicacion es de publish-package.yml.
        type: boolean
        default: false
      runner:
        description: 'JSON: etiqueta de runner (`"ubuntu-latest"`) o array (self-hosted, p. ej. `["self-hosted","linux","x64"]`).'
        type: string
        default: '"ubuntu-latest"'
      package-manager:
        description: '`auto` (por lockfile), `npm`, `pnpm` o `yarn`.'
        type: string
        default: auto
    outputs:
      version:
        description: Version semver (2.4).
        value: ${{ jobs.build-and-test.outputs.version }}
      artifact-name:
        description: Nombre del artefacto subido.
        value: ${{ jobs.build-and-test.outputs.artifact-name }}
      artifact-path:
        description: Ruta del artefacto principal (.tgz o tar.gz de dist) relativa a la raiz del repo.
        value: ${{ jobs.build-and-test.outputs.artifact-path }}
      package-id:
        description: Solo library. Identificador en el registro (p. ej. `@acme/lib@1.2.3`).
        value: ${{ jobs.build-and-test.outputs.package-id }}

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      primary: ${{ steps.matrix.outputs.primary }}
    steps:
      - name: Fusionar matriz con valores por defecto
        id: matrix
        env:
          INPUT_MATRIX: ${{ inputs.matrix || '{}' }}
        run: |
          set -euo pipefail
          defaults='{"node":["22"]}'
          m=$(jq -cn --argjson d "$defaults" --argjson i "$INPUT_MATRIX" '$d * $i')
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "primary=$(jq -r '.node[0]' <<< "$m")" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: prepare
    if: ${{ inputs.run-tests }}
    runs-on: ${{ matrix.os || fromJSON(inputs.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detectar gestor de paquetes y lockfile
        id: pm
        env:
          WD: ${{ inputs.working-directory }}
          PM_INPUT: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          pm="$PM_INPUT"
          if [ "$pm" = "auto" ]; then
            if [ -f "$WD/pnpm-lock.yaml" ]; then pm=pnpm
            elif [ -f "$WD/yarn.lock" ]; then pm=yarn
            else pm=npm; fi
          fi
          case "$pm" in
            npm)  lock="$WD/package-lock.json" ;;
            pnpm) lock="$WD/pnpm-lock.yaml" ;;
            yarn) lock="$WD/yarn.lock" ;;
            *) echo "::error::package-manager no soportado: $pm"; exit 1 ;;
          esac
          [ -f "$lock" ] || { echo "::error::Falta el lockfile '$lock'. Es obligatorio para builds reproducibles."; exit 1; }
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "lockfile=${lock#./}" >> "$GITHUB_OUTPUT"

      - name: Habilitar corepack (pnpm/yarn)
        if: ${{ steps.pm.outputs.pm != 'npm' }}
        run: corepack enable

      - name: Configurar Node y cache del gestor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Instalar dependencias (desde lockfile)
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          esac

      - name: Tests
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail
          if ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "::error::run-tests=true pero package.json no define el script 'test'."
            exit 1
          fi
          case "$PM" in
            npm)  npm test ;;
            pnpm) pnpm test ;;
            yarn) yarn test ;;
          esac

  build-and-test:
    name: build-and-test
    needs: [prepare, test]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
      artifact-path: ${{ steps.pkg.outputs.artifact-path }}
      package-id: ${{ steps.pkg.outputs.package-id }}
    steps:
      - name: Comprobar resultado de tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
            echo "::error::El job test ha terminado con '$TEST_RESULT'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detectar gestor de paquetes y lockfile
        id: pm
        env:
          WD: ${{ inputs.working-directory }}
          PM_INPUT: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          pm="$PM_INPUT"
          if [ "$pm" = "auto" ]; then
            if [ -f "$WD/pnpm-lock.yaml" ]; then pm=pnpm
            elif [ -f "$WD/yarn.lock" ]; then pm=yarn
            else pm=npm; fi
          fi
          case "$pm" in
            npm)  lock="$WD/package-lock.json" ;;
            pnpm) lock="$WD/pnpm-lock.yaml" ;;
            yarn) lock="$WD/yarn.lock" ;;
            *) echo "::error::package-manager no soportado: $pm"; exit 1 ;;
          esac
          [ -f "$lock" ] || { echo "::error::Falta el lockfile '$lock'."; exit 1; }
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "lockfile=${lock#./}" >> "$GITHUB_OUTPUT"

      - name: Habilitar corepack (pnpm/yarn)
        if: ${{ steps.pm.outputs.pm != 'npm' }}
        run: corepack enable

      - name: Configurar Node (runtime principal de la matriz) y cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.prepare.outputs.primary }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Instalar dependencias (desde lockfile)
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          esac

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail
          case "$PM" in
            npm)  npm run build --if-present ;;
            pnpm) pnpm run --if-present build ;;
            yarn) if yarn run | grep -q ' build'; then yarn run build; fi ;;
          esac

      - name: Calcular version y nombre de artefacto
        id: meta
        working-directory: ${{ inputs.working-directory }}
        env:
          PUBLISH: ${{ inputs.publish }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          base="${base%%[-+]*}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag no valido '$GITHUB_REF_NAME' (se espera vX.Y.Z)."; exit 1; }
          else
            branch=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
            version="${base:-0.0.0}-${branch}.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          if [ "$PUBLISH" = "true" ]; then
            [ "$KIND" = "library" ] || { echo "::error::publish=true solo aplica a kind=library."; exit 1; }
            [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "::error::publish=true requiere un tag v*."; exit 1; }
            [ "$version" = "$base" ] || { echo "::error::El tag ($version) no coincide con package.json ($base)."; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${GITHUB_REPOSITORY##*/}-$version" >> "$GITHUB_OUTPUT"

      - name: Empaquetar
        id: pkg
        working-directory: ${{ inputs.working-directory }}
        env:
          KIND: ${{ inputs.kind }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
          LOCKFILE: ${{ steps.pm.outputs.lockfile }}
          PM: ${{ steps.pm.outputs.pm }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"
          name=$(node -p "require('./package.json').name")
          if [ "$KIND" = "library" ]; then
            # Version de PR/rama: prerelease no publicable (contrato 2.4).
            npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
            npm pack --pack-destination "$out" >/dev/null
            main=$(ls "$out"/*.tgz | head -n1)
            echo "package-id=$name@$VERSION" >> "$GITHUB_OUTPUT"
          else
            [ -d dist ] || { echo "::error::Aplicacion sin carpeta dist/ tras el build."; exit 1; }
            main="$out/$ARTIFACT_NAME.tar.gz"
            tar -czf "$main" dist package.json "$(basename "$LOCKFILE")"
            echo "package-id=" >> "$GITHUB_OUTPUT"
          fi
          echo "artifact-path=artifacts/$(basename "$main")" >> "$GITHUB_OUTPUT"

      - name: Subir artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: artifacts/
          if-no-files-found: error
