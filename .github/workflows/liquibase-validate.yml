# Liquibase - validate
# Workflow reutilizable: valida el changelog contra la base de datos del entorno indicado.
# Equivalente en la libreria Jenkins: vars/liquibase_validate.groovy (llamado desde Liquibase_*_{develop,feature,release}).
# Los secretos y variables se leen del entorno (environment) del job; el caller no los pasa.
name: Liquibase - validate

on:
  workflow_call:
    inputs:
      database:
        description: "Motor de base de datos: mongo o postgres"
        type: string
        required: true
      environment:
        description: "Entorno de despliegue: dev, staging o prod"
        type: string
        required: true
      changelog-path:
        description: "Ruta relativa del changelog dentro del repo (p. ej. db/changelog/db.changelog-master.xml)"
        type: string
        required: true
      runner:
        description: "Etiquetas del runner en JSON. Por defecto self-hosted secure-prod, porque el job accede a la BBDD privada"
        type: string
        required: false
        default: '["self-hosted","linux","x64","secure-prod"]'

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ${{ fromJSON(inputs.runner) }}
    # deployment: false usa los secretos y variables del entorno sin crear un deployment (no infla el KPI de despliegues)
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DATABASE: ${{ inputs.database }}
      ENVIRONMENT: ${{ inputs.environment }}
      CHANGELOG_PATH: ${{ inputs.changelog-path }}
      DB_SCHEMA: ${{ vars.DB_SCHEMA }}
      LOG_LEVEL: ${{ vars.LIQUIBASE_LOG_LEVEL }}
      LIQUIBASE_IMAGE_POSTGRES: ${{ vars.LIQUIBASE_IMAGE_POSTGRES }}
      LIQUIBASE_IMAGE_MONGO: ${{ vars.LIQUIBASE_IMAGE_MONGO }}
      # Liquibase lee la conexion de variables LIQUIBASE_COMMAND_*: la contrasena nunca aparece en la linea de comandos
      LIQUIBASE_COMMAND_URL: ${{ vars.DB_URL }}
      LIQUIBASE_COMMAND_USERNAME: ${{ secrets.SEC_DB_USERNAME }}
      LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.SEC_DB_PASSWORD }}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: ${{ inputs.changelog-path }}
      LIQUIBASE_SEARCH_PATH: /liquibase/workspace
    steps:
      - name: Checkout del repo del caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar entradas y configuracion
        shell: bash
        run: |
          set -euo pipefail
          case "$DATABASE" in mongo|postgres) ;; *) echo "::error::database debe ser mongo o postgres"; exit 1 ;; esac
          case "$ENVIRONMENT" in dev|staging|prod) ;; *) echo "::error::environment debe ser dev, staging o prod"; exit 1 ;; esac
          if [[ ! "$CHANGELOG_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$CHANGELOG_PATH" == *..* ]] || [[ "$CHANGELOG_PATH" == /* ]]; then
            echo "::error::changelog-path no es una ruta relativa valida"
            exit 1
          fi
          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "::error::no existe el changelog $CHANGELOG_PATH"
            exit 1
          fi
          if [ "$DATABASE" = postgres ]; then
            [ -n "${LIQUIBASE_IMAGE_POSTGRES:-}" ] || { echo "::error::falta la variable de organizacion LIQUIBASE_IMAGE_POSTGRES"; exit 1; }
          else
            [ -n "${LIQUIBASE_IMAGE_MONGO:-}" ] || { echo "::error::falta la variable de organizacion LIQUIBASE_IMAGE_MONGO"; exit 1; }
          fi
          [ -n "${LIQUIBASE_COMMAND_URL:-}" ] || { echo "::error::falta la variable DB_URL en el entorno $ENVIRONMENT"; exit 1; }
          [ -n "${LIQUIBASE_COMMAND_USERNAME:-}" ] || { echo "::error::falta el secreto SEC_DB_USERNAME en el entorno $ENVIRONMENT"; exit 1; }
          [ -n "${LIQUIBASE_COMMAND_PASSWORD:-}" ] || { echo "::error::falta el secreto SEC_DB_PASSWORD en el entorno $ENVIRONMENT"; exit 1; }

      - name: Liquibase validate
        shell: bash
        run: |
          set -euo pipefail
          LOG_LEVEL="${LOG_LEVEL:-INFO}"
          EXTRA_ARGS=()
          if [ "$DATABASE" = postgres ]; then
            IMAGE="$LIQUIBASE_IMAGE_POSTGRES"
            if [ -n "$DB_SCHEMA" ]; then
              EXTRA_ARGS+=("--default-schema-name=$DB_SCHEMA")
            fi
          else
            IMAGE="$LIQUIBASE_IMAGE_MONGO"
            EXTRA_ARGS+=("--databaseClass=liquibase.ext.mongodb.database.MongoLiquibaseDatabase")
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/liquibase/workspace" \
            -w /liquibase/workspace \
            -e LIQUIBASE_COMMAND_URL \
            -e LIQUIBASE_COMMAND_USERNAME \
            -e LIQUIBASE_COMMAND_PASSWORD \
            -e LIQUIBASE_COMMAND_CHANGELOG_FILE \
            -e LIQUIBASE_SEARCH_PATH \
            "$IMAGE" "${EXTRA_ARGS[@]}" --log-level="$LOG_LEVEL" validate

      - name: Resumen
        shell: bash
        run: |
          {
            echo "### Liquibase validate"
            echo "- Motor: \`$DATABASE\`"
            echo "- Entorno: \`$ENVIRONMENT\`"
            echo "- Changelog: \`$CHANGELOG_PATH\`"
            echo "- Resultado: OK"
          } >> "$GITHUB_STEP_SUMMARY"
